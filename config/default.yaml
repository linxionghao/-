# 非机密默认配置。
# 用户级覆盖写 config/local.yaml（已在 .gitignore 中），不要改本文件以外的默认值。
# 环境变量 QT_<SECTION>__<KEY> 优先级最高，例如 QT_TRACE__MAX_DEPTH=8

app:
  name: quality-trace
  log_level: INFO        # DEBUG / INFO / WARNING / ERROR

trace:
  direction: both        # forward(原料→成品) / backward(成品→原料) / both
  max_depth: 5           # 谱系向下追溯的最大层数

attribution:
  min_records: 3         # 参与统计相关的最少记录数，低于此值不下结论
  confidence_floor: 0.6  # 疑似原因的置信度下限，低于此值只列不排
