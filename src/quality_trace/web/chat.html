<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quality-trace · 质量知识问答</title>
<!-- 空 favicon：避免浏览器自动请求 /favicon.ico 产生无意义的 404 -->
<link rel="icon" href="data:,">
<style>
  /* ---------- 基础布局：顶部栏 + 消息流 + 输入区 ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.7 "Microsoft YaHei", "PingFang SC", sans-serif;
         background: #f2f4f7; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f3a5f; color: #fff; padding: 10px 20px;
           display: flex; align-items: center; gap: 12px; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
  header .dot.ok { background: #52c41a; }
  header .dot.warn { background: #faad14; }
  header .dot.err { background: #ff4d4f; }
  header .who { margin-left: auto; font-size: 12px; opacity: .85; }

  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 78%; margin-bottom: 16px; }
  .msg.user { margin-left: auto; }
  .bubble { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap;
            word-break: break-word; }
  .msg.user .bubble { background: #1f3a5f; color: #fff; }
  .msg.bot .bubble { background: #fff; border: 1px solid #e3e8ee; }
  .meta { font-size: 12px; color: #999; margin: 4px 6px; }

  /* ---------- 引用卡片：文档名 + 条款号 + 版本号 ---------- */
  .citations { margin-top: 8px; border-top: 1px dashed #e3e8ee; padding-top: 6px; }
  .citations .cap { font-size: 12px; color: #888; margin-bottom: 4px; }
  .cit-card { font-size: 12px; background: #f6f8fa; border: 1px solid #e3e8ee;
              border-radius: 6px; padding: 6px 10px; margin-bottom: 4px;
              cursor: pointer; }
  .cit-card .doc { font-weight: bold; color: #1f3a5f; }
  .cit-card .ver { color: #fa8c16; margin-left: 6px; }
  .cit-card .type { float: right; color: #999; }
  .cit-card .snippet { display: none; color: #666; margin-top: 4px;
                       border-top: 1px dotted #ddd; padding-top: 4px; }
  .cit-card.open .snippet { display: block; }

  /* ---------- 状态条：检索中 / 降级黄条 / 错误红条 ---------- */
  #status { display: none; padding: 8px 20px; font-size: 13px; }
  #status.busy { display: block; color: #1f3a5f; background: #e6f0ff; }
  #status.degraded { display: block; color: #7a5c00; background: #fffbe6; }
  #status.error { display: block; color: #a8071a; background: #fff1f0; }

  footer { border-top: 1px solid #ddd; background: #fff; padding: 12px 20px;
           display: flex; gap: 10px; }
  #question { flex: 1; resize: none; height: 66px; padding: 8px 10px;
              border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  button { padding: 0 22px; border: none; border-radius: 6px; cursor: pointer;
           font: inherit; }
  #send { background: #1f3a5f; color: #fff; }
  #send:disabled { background: #9db4d0; cursor: not-allowed; }
  #stop { background: #fff; color: #cf1322; border: 1px solid #cf1322; display: none; }

  /* 打字机光标 */
  .caret::after { content: "▍"; animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<header>
  <span id="healthDot" class="dot"></span>
  <strong>quality-trace 质量知识问答</strong>
  <span id="healthText" style="font-size:12px">连接中…</span>
  <span class="who">角色：质量工程师（qe-001）</span>
</header>

<div id="messages"></div>
<div id="status"></div>

<footer>
  <textarea id="question" placeholder="例如：切刀磨损导致螺纹外径偏小，怎么处理？（Enter 发送）"></textarea>
  <button id="send">发送</button>
  <button id="stop">停止</button>
</footer>

<script>
"use strict";
/* =====================================================================
 * 前端约定（与 docs/chat-api.md 第 7 节一致）：
 *   - SSE 用 fetch + ReadableStream 手动解析（EventSource 不支持 POST）；
 *   - delta 入打字机队列，requestAnimationFrame 逐字吐出；
 *   - sources 渲染在回答卡片底部：文档名 + 条款号 + 版本号；
 *   - 降级（degraded）黄条提示、错误（error）红条提示。
 * ===================================================================== */

const API = "";                                   // 同源部署，无前缀
const HEADERS = {                                  // 决策 C①：请求头模拟身份
  "Content-Type": "application/json",
  "X-User-Id": "qe-001",
  "X-Role": "quality_engineer",
};

const $messages = document.getElementById("messages");
const $status   = document.getElementById("status");
const $question = document.getElementById("question");
const $send     = document.getElementById("send");
const $stop     = document.getElementById("stop");

let sessionId = localStorage.getItem("qt_session") || "";   // 会话跨刷新保留
let controller = null;                                       // 停止按钮用

/* ---------------------------- 工具函数 ---------------------------- */
function setStatus(cls, text) {
  $status.className = cls;
  $status.textContent = text || "";
}
function docTypeLabel(t) {                                    // doc_type → 中文标签
  return { standard: "检验标准", sop_manual: "工艺文件", "8d_case": "历史8D" }[t] || "资料";
}
function scrollBottom() { $messages.scrollTop = $messages.scrollHeight; }

/* ---------------------------- 消息气泡 ---------------------------- */
function addUserBubble(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  $messages.appendChild(div);
  scrollBottom();
}

function addBotBubble() {
  const div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = `<div class="meta">质量知识库</div>
                  <div class="bubble"></div>
                  <div class="citations" style="display:none"></div>`;
  $messages.appendChild(div);
  return {
    bubble: div.querySelector(".bubble"),
    cites:  div.querySelector(".citations"),
  };
}

/* ------------------------ 引用卡片（底部展示） ------------------------ */
function renderCitations(box, sources) {
  if (!sources || !sources.length) return;
  box.style.display = "block";
  box.innerHTML = `<div class="cap">引用依据（点击展开原文片段）</div>`;
  sources.forEach(s => {
    const card = document.createElement("div");
    card.className = "cit-card";
    // 三要素：文档名 + 条款号 + 版本号（版本缺失显示 —）
    card.innerHTML =
      `<span class="type">${docTypeLabel(s.doc_type)}</span>` +
      `<span class="doc">${s.source_file}</span>` +
      `<span class="ver">${s.version ? "版本 " + s.version : "—"}</span>` +
      `<div class="meta">条款：${s.clause || "—"} ｜ 相关度 ${(s.score || 0).toFixed(4)}</div>` +
      `<div class="snippet"></div>`;
    card.querySelector(".snippet").textContent = s.snippet || "";
    card.onclick = () => card.classList.toggle("open");       // 展开/收起原文
    box.appendChild(card);
  });
}

/* ---------------------------- 打字机 ---------------------------- */
const typeQueue = [];
let typing = false;
function typeFeed(el) {
  /* delta 全部进队列，rAF 每帧吐 1~2 字，避免整段闪现 */
  typeQueue.push(el);
  if (!typing) requestAnimationFrame(step);
}
function step() {
  typing = typeQueue.length > 0;
  if (!typing) return;
  const el = typeQueue[0];
  const text = el._pending || "";
  const n = Math.min(2, text.length - (el._shown || 0));     // 每帧 2 字
  if (n > 0) {
    el.textContent += text.slice(el._shown || 0, (el._shown || 0) + n);
    el._shown = (el._shown || 0) + n;
    scrollBottom();
  }
  if ((el._shown || 0) >= text.length) typeQueue.shift();     // 本条吐完
  requestAnimationFrame(step);
}

/* ---------------------------- SSE 解析 ---------------------------- */
async function ask(question) {
  controller = new AbortController();
  $send.disabled = true;
  $stop.style.display = "inline-block";
  setStatus("busy", "正在检索依据…");

  const ui = addBotBubble();
  ui.bubble.classList.add("caret");

  let finalText = "";      // 打字机最终文本（流结束去掉光标）
  let gotDelta = false;

  try {
    const resp = await fetch(API + "/api/v1/chat", {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify({ session_id: sessionId || null, question }),
      signal: controller.signal,
    });

    /* 流前校验失败：普通 JSON（code != 0），直接红条 */
    const ctype = resp.headers.get("content-type") || "";
    if (!ctype.includes("event-stream")) {
      const err = await resp.json();
      setStatus("error", `[${err.code}] ${err.detail?.message || err.message || "请求失败"}`);
      ui.bubble.classList.remove("caret");
      ui.bubble.textContent = "（本次提问失败，请修正后重试）";
      return;
    }

    /* 逐块解析 SSE：按空行分隔事件，取出 event 与 data */
    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
        const ev = { event: "message", data: "" };
        block.split("\n").forEach(line => {
          if (line.startsWith("event:")) ev.event = line.slice(6).trim();
          if (line.startsWith("data:"))  ev.data  = line.slice(5).trim();
        });
        handleEvent(ev, ui, t => { finalText += t; gotDelta = true; });
      }
    }
  } catch (e) {
    if (e.name === "AbortError") {                 // 用户点了「停止」
      setStatus("degraded", "已手动停止生成（内容标记为不完整）");
    } else {
      setStatus("error", "网络异常：" + e.message);
    }
  } finally {
    ui.bubble.classList.remove("caret");
    if (!gotDelta && !finalText) ui.bubble.textContent = "（无回答，请查看引用依据）";
    $send.disabled = false;
    $stop.style.display = "none";
    controller = null;
    setTimeout(() => setStatus("", ""), 5000);      // 状态条 5 秒后自动消失
  }
}

/* 单个 SSE 事件 → UI 行为（对照 docs/chat-api.md 3.3） */
function handleEvent(ev, ui, appendText) {
  let data = {};
  try { data = JSON.parse(ev.data || "{}"); } catch (e) { return; }

  switch (ev.event) {
    case "status":                                  // 正在检索依据…
      setStatus("busy", data.message || "处理中…");
      break;
    case "sources":                                 // 引用先到，渲染在卡片底部
      renderCitations(ui.cites, data.sources);
      setStatus("busy", "正在生成回答…");
      break;
    case "delta":                                   // 打字机追加
      appendText(data.text || "");
      ui.bubble._pending = (ui.bubble._pending || "") + (data.text || "");
      typeFeed(ui.bubble);
      break;
    case "done":
      if (data.session_id) {
        sessionId = data.session_id;
        localStorage.setItem("qt_session", sessionId);
      }
      if (data.degraded)                            // 降级：黄条，非失败
        setStatus("degraded", `[${data.degraded.code}] ${data.degraded.message}`);
      else setStatus("", "");
      break;
    case "error":                                   // 流中失败：红条
      setStatus("error", `[${data.code}] ${data.message}`);
      break;
    /* ": ping" 心跳注释行不会走到这里 */
  }
}

/* ---------------------------- 会话恢复 ---------------------------- */
async function restoreHistory() {
  if (!sessionId) return;
  try {
    const resp = await fetch(`${API}/api/v1/sessions/${sessionId}/messages`,
                             { headers: HEADERS });
    const body = await resp.json();
    if (body.code !== 0 || !body.data.messages.length) return;
    body.data.messages.forEach(m => {
      if (m.role === "user") addUserBubble(m.content);
      else {
        const ui = addBotBubble();
        ui.bubble.textContent = m.content || "（无回答）";
        renderCitations(ui.cites, m.citations);
      }
    });
    if (body.data.messages[body.data.messages.length - 1].status === "partial")
      setStatus("degraded", "上次回答未生成完毕");
  } catch (e) { /* 恢复失败不阻塞新提问 */ }
}

/* ---------------------------- 健康检查 ---------------------------- */
async function checkHealth() {
  const dot = document.getElementById("healthDot");
  const text = document.getElementById("healthText");
  try {
    const body = await (await fetch(API + "/api/v1/health")).json();
    const d = body.data;
    dot.className = "dot " + (d.llm_key_ready ? "ok" : "warn");
    text.textContent = `模型：${d.model}${d.llm_key_ready ? "" : "（未配置 Key，回答将降级）"}`;
  } catch (e) {
    dot.className = "dot err";
    text.textContent = "服务不可用";
  }
}

/* ---------------------------- 事件绑定 ---------------------------- */
$send.onclick = () => {
  const q = $question.value.trim();
  if (!q) return;
  $question.value = "";
  addUserBubble(q);
  ask(q);
};
$question.onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $send.onclick(); }
};
$stop.onclick = () => controller && controller.abort();

checkHealth();
restoreHistory();
</script>
</body>
</html>
