<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 移动优先：禁止缩放，保证大按钮在车间戴手套也能点中 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>现场缺陷录入 · quality-trace</title>
<!-- 空 favicon：避免浏览器自动请求 /favicon.ico 产生无意义的 404 -->
<link rel="icon" href="data:,">
<style>
  /* 设计取向：高对比、大字号、大触控区（最小 44px），弱光车间也能看清 */
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1a2233; --muted:#6b7688;
    --brand:#1f6feb; --brand-dark:#1558c0; --warn:#b45309; --warn-bg:#fef3c7;
    --danger:#c0392b; --ok:#0f766e; --line:#e3e8ef; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.5;}
  body{padding-bottom:32px;}
  .wrap{max-width:520px; margin:0 auto; padding:12px;}
  /* ---------- 顶栏 ---------- */
  .topbar{position:sticky; top:0; z-index:20; background:var(--brand); color:#fff;
    padding:10px 14px; display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 8px rgba(16,24,40,.12);}
  .topbar h1{font-size:17px; margin:0; font-weight:600; flex:1;}
  .queue-badge{background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.45);
    color:#fff; border-radius:999px; padding:5px 11px; font-size:13px; cursor:pointer;}
  .queue-badge.hot{background:#fff; color:var(--warn); font-weight:700;}
  /* ---------- 步骤条 ---------- */
  .steps{display:flex; gap:6px; margin:12px 0 14px;}
  .steps .s{flex:1; text-align:center; font-size:12px; color:var(--muted);
    padding:8px 4px; background:#e9edf4; border-radius:10px; transition:.2s;}
  .steps .s.on{background:var(--brand); color:#fff; font-weight:600;}
  .steps .s.done{background:#d1fae5; color:#065f46;}
  /* ---------- 卡片与表单 ---------- */
  .card{background:var(--card); border-radius:var(--radius); padding:16px;
    margin-bottom:12px; box-shadow:0 1px 3px rgba(16,24,40,.08);}
  .card h2{font-size:15px; margin:0 0 12px; font-weight:600;}
  .field{margin-bottom:16px;}
  .field > label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  input[type=text], input[type=password], textarea, input[type=number]{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:14px;
    font-size:16px; font-family:inherit; background:#fff; color:var(--ink); outline:none;}
  input:focus, textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(31,111,235,.12);}
  textarea{min-height:96px; resize:vertical;}
  .hint{font-size:12px; color:var(--muted); margin-top:6px;}
  .err-text{font-size:12px; color:var(--danger); margin-top:6px; display:none;}
  .err-text.show{display:block;}
  /* ---------- 大按钮组 ---------- */
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1.5px solid var(--line); background:#fff; color:var(--ink);
    border-radius:12px; padding:12px 14px; font-size:15px; cursor:pointer; min-height:48px;}
  .chip.on{border-color:var(--brand); background:#e8f0fe; color:var(--brand-dark); font-weight:600;}
  .chip.wide{flex:1 1 100%; text-align:center;}
  /* ---------- 数量 stepper ---------- */
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:56px; height:56px; font-size:26px; border-radius:12px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;}
  .stepper input{flex:1; text-align:center; font-size:22px; font-weight:700;}
  /* ---------- 主按钮 ---------- */
  .btn{width:100%; border:none; border-radius:14px; padding:17px; font-size:17px;
    font-weight:600; cursor:pointer; background:var(--brand); color:#fff; min-height:56px;}
  .btn:active{background:var(--brand-dark);}
  .btn:disabled{opacity:.55;}
  .btn.ghost{background:#fff; color:var(--brand); border:1.5px solid var(--brand);}
  .btn.danger-ghost{background:#fff; color:var(--danger); border:1.5px solid #f3c6c1;}
  /* ---------- 状态条 ---------- */
  .banner{border-radius:12px; padding:11px 13px; font-size:13.5px; margin-bottom:12px;}
  .banner.warn{background:var(--warn-bg); color:var(--warn); border:1px solid #fde68a;}
  .banner.err{background:#fdecea; color:var(--danger); border:1px solid #f5c6c0;}
  .banner.info{background:#e8f0fe; color:var(--brand-dark); border:1px solid #c7dbfb;}
  .hidden{display:none !important;}
  /* ---------- 登录遮罩 ---------- */
  .login-mask{position:fixed; inset:0; background:rgba(16,24,40,.55); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-box{background:#fff; border-radius:18px; padding:22px; width:100%; max-width:380px;}
  .login-box h2{margin:0 0 6px; font-size:19px;}
  .login-box p{margin:0 0 16px; color:var(--muted); font-size:13px;}
  /* ---------- 回执 ---------- */
  .receipt{text-align:center; padding:22px 16px;}
  .receipt .no{font-size:30px; font-weight:800; letter-spacing:1px; color:var(--ok);}
  .receipt .sub{color:var(--muted); font-size:13px; margin-top:6px;}
  .badge-backfill{display:inline-block; margin-top:10px; background:var(--warn-bg);
    color:var(--warn); border:1px solid #fde68a; border-radius:999px;
    padding:5px 12px; font-size:12.5px; font-weight:600;}
  /* ---------- 列表 ---------- */
  .list-item{display:flex; justify-content:space-between; gap:10px; padding:12px 0;
    border-bottom:1px solid var(--line); font-size:13.5px;}
  .list-item:last-child{border-bottom:none;}
  .list-item .meta{color:var(--muted); font-size:12px;}
  .tag{font-size:11.5px; border-radius:6px; padding:2px 7px; background:#eef2f7; color:var(--muted);}
  .tag.pending{background:#e8f0fe; color:var(--brand-dark);}
  .tag.draft{background:#fff7e6; color:var(--warn);}
  .tag.backfill{background:var(--warn-bg); color:var(--warn);}
</style>
</head>
<body>

<!-- ============ 顶栏：标题 + 离线队列角标 ============ -->
<div class="topbar">
  <h1>现场缺陷录入</h1>
  <button class="queue-badge" id="queue-badge" onclick="showQueue()">0 条待补传</button>
</div>

<div class="wrap">
  <!-- ============ 步骤条 ============ -->
  <div class="steps">
    <div class="s on" id="step1-tab">① 填写</div>
    <div class="s" id="step2-tab">② 确认缺陷码</div>
    <div class="s" id="step3-tab">③ 提交完成</div>
  </div>

  <!-- 全局提示条（离线 / 错误 / 降级） -->
  <div id="banner" class="banner hidden"></div>

  <!-- ============ 第 1 步：填单 ============ -->
  <section id="step1">
    <div class="card">
      <h2>工单与工序</h2>
      <div class="field">
        <label for="work-order">工单号</label>
        <input type="text" id="work-order" placeholder="扫码或手输，如 WO-20261030-001"
               autocomplete="off" inputmode="text">
        <div class="hint" id="wo-hint">联网时失焦自动校验工单是否存在</div>
        <div class="err-text" id="wo-err"></div>
      </div>
      <div class="field">
        <label>工序码</label>
        <div class="chips" id="op-chips"></div>
      </div>
    </div>

    <div class="card">
      <h2>缺陷描述</h2>
      <div class="field">
        <textarea id="description" maxlength="500"
          placeholder="写清看到的现象，例如：螺纹外径偏小，通止规止端过不去"></textarea>
        <div class="hint"><span id="desc-count">0</span>/500 · 描述越具体，候选缺陷码越准</div>
        <div class="err-text" id="desc-err"></div>
      </div>
      <div class="field">
        <label>不良数量</label>
        <div class="stepper">
          <button type="button" onclick="bumpQty(-1)">−</button>
          <input type="number" id="qty" value="1" min="1" max="99999" inputmode="numeric">
          <button type="button" onclick="bumpQty(1)">+</button>
        </div>
      </div>
      <div class="field">
        <label>严重度</label>
        <div class="chips" id="sev-chips">
          <button type="button" class="chip" data-sev="轻微">轻微</button>
          <button type="button" class="chip on" data-sev="一般">一般</button>
          <button type="button" class="chip" data-sev="严重">严重</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>现场照片（可选）</h2>
      <input type="file" id="photo-input" accept="image/*" capture="environment" class="hidden">
      <button type="button" class="btn ghost" onclick="document.getElementById('photo-input').click()">
        📷 拍照 / 选择照片
      </button>
      <div class="hint">拍照后自动压缩到最长边 1280、约 200KB，弱网也能传</div>
      <div id="photo-preview" class="hidden" style="margin-top:12px;">
        <img id="photo-img" alt="现场照片预览" style="width:100%; border-radius:12px;">
        <button type="button" class="btn danger-ghost" style="margin-top:8px"
                onclick="clearPhoto()">删除照片</button>
      </div>
    </div>

    <button class="btn" id="btn-submit" onclick="submitDefect()">提交并获取候选缺陷码</button>
    <div class="hint" style="text-align:center; margin-top:10px">
      提交后仍是「待确认」，需你亲手确认缺陷码才正式上报
    </div>
  </section>

  <!-- ============ 第 2 步：确认缺陷码（JS 渲染） ============ -->
  <section id="step2" class="hidden">
    <div class="card">
      <h2>请选择最接近的缺陷码</h2>
      <div class="hint" style="margin-bottom:12px">
        系统只做「建议」，最终由你确认。选错了下游会跟着错。
      </div>
      <div id="suggest-area"></div>
      <button class="btn ghost" style="margin-top:14px" onclick="toggleAllCodes()">
        都不对，查看全部缺陷码
      </button>
      <div id="all-codes" class="hidden" style="margin-top:12px"></div>
    </div>
    <div class="hint" style="text-align:center; margin-bottom:10px">
      单据号：<span id="draft-no">—</span> · 状态：待确认
    </div>
  </section>

  <!-- ============ 第 3 步：回执 ============ -->
  <section id="step3" class="hidden">
    <div class="card receipt">
      <div style="font-size:13px; color:var(--muted)">缺陷单已提交</div>
      <div class="no" id="receipt-no">—</div>
      <div class="sub" id="receipt-status">已提交，等待质量工程师判定</div>
      <div id="receipt-backfill" class="badge-backfill hidden">补录 · 非实时上报</div>
    </div>
    <button class="btn" onclick="resetForm()">再录一条</button>
    <button class="btn ghost" style="margin-top:10px" onclick="location.reload()">查看本线最近记录</button>
  </section>

  <!-- ============ 本线最近记录 ============ -->
  <div class="card" id="recent-card">
    <h2>本线最近记录</h2>
    <div id="recent-list"><div class="hint">加载中…</div></div>
  </div>
</div>

<!-- ============ 登录遮罩 ============ -->
<div class="login-mask" id="login-mask">
  <div class="login-box">
    <h2>班组长登录</h2>
    <p>仅班组长可录入；登录后只能看到本产线数据。</p>
    <div class="field">
      <label for="username">登录名</label>
      <input type="text" id="username" autocomplete="username" placeholder="如 leader01">
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="密码">
    </div>
    <div class="err-text" id="login-err"></div>
    <button class="btn" id="btn-login" onclick="doLogin()">登录</button>
  </div>
</div>

<script>
/* =====================================================================
   前端状态与常量
   ===================================================================== */
const API = "/api/v1";
const QUEUE_KEY = "qt_defect_queue";        // 离线暂存键（localStorage）
const QUEUE_MAX = 20;                        // 队列上限，超限提示先联网
const LS_TOKEN = "qt_token";                 // 令牌
const LS_USER = "qt_user";                   // 当前用户（含 role/line_id）

const state = {
  token: localStorage.getItem(LS_TOKEN) || "",
  user: JSON.parse(localStorage.getItem(LS_USER) || "null"),
  codes: [],           // 缺陷码字典（分组展示）
  codeIndex: {},       // code → {name, category}
  opCode: "",
  photoToken: null,
  draftNo: null,       // 第一步返回的草稿号
  suggested: [],
  selectedCode: null,
  submitting: false,
};

/* 工序码：现场固定几道工序，做成大按钮比下拉更快 */
const OP_CODES = ["OP10", "OP20", "OP30", "OP40", "OP50"];

/* =====================================================================
   通用工具：请求封装 / 提示条 / 步骤切换
   ===================================================================== */
async function api(path, options = {}) {
  const headers = Object.assign(
    { "Content-Type": "application/json" },
    options.headers || {}
  );
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const resp = await fetch(API + path, Object.assign({}, options, { headers }));
  let body;
  try {
    body = await resp.json();
  } catch (e) {
    throw { code: -1, message: "服务返回异常，请稍后重试" };
  }
  // 401：令牌过期/无效 → 回到登录
  if (body.code === 40101 || body.code === 40103) {
    logout();
    throw body;
  }
  if (body.code !== 0) throw body;      // 业务错误统一带中文 message
  return body.data;
}

function banner(text, kind = "info", sticky = false) {
  const el = document.getElementById("banner");
  el.className = "banner " + kind;
  el.textContent = text;
  el.classList.remove("hidden");
  if (!sticky) setTimeout(() => el.classList.add("hidden"), 4000);
}

function setStep(n) {
  ["step1", "step2", "step3"].forEach((id, i) => {
    document.getElementById(id).classList.toggle("hidden", i !== n - 1);
  });
  const tabs = ["step1-tab", "step2-tab", "step3-tab"];
  tabs.forEach((id, i) => {
    const el = document.getElementById(id);
    el.className = "s" + (i === n - 1 ? " on" : (i < n - 1 ? " done" : ""));
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

/* =====================================================================
   登录
   ===================================================================== */
async function doLogin() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const err = document.getElementById("login-err");
  err.classList.remove("show");
  if (!username || !password) {
    err.textContent = "请填写登录名和密码";
    err.classList.add("show");
    return;
  }
  const btn = document.getElementById("btn-login");
  btn.disabled = true; btn.textContent = "登录中…";
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: JSON.stringify({ username, password }),
    });
    if (data.user.role !== "shift_leader") {
      err.textContent = "该账号不是班组长，无法使用现场录入";
      err.classList.add("show");
      return;
    }
    state.token = data.token;
    state.user = data.user;
    localStorage.setItem(LS_TOKEN, data.token);
    localStorage.setItem(LS_USER, JSON.stringify(data.user));
    document.getElementById("login-mask").classList.add("hidden");
    await boot();
  } catch (e) {
    err.textContent = e.message || "登录失败";
    err.classList.add("show");
  } finally {
    btn.disabled = false; btn.textContent = "登录";
  }
}

function logout() {
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_USER);
  state.token = ""; state.user = null;
  document.getElementById("login-mask").classList.remove("hidden");
}

/* =====================================================================
   初始化：字典 / 工序按钮 / 最近记录 / 队列
   ===================================================================== */
async function boot() {
  renderOpChips();
  bindEvents();
  await Promise.all([loadCodes(), loadRecent()]);
  updateQueueBadge();
  startQueueTimer();
}

function renderOpChips() {
  const box = document.getElementById("op-chips");
  box.innerHTML = "";
  OP_CODES.forEach(code => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.textContent = code;
    btn.onclick = () => {
      state.opCode = code;
      [...box.children].forEach(c => c.classList.remove("on"));
      btn.classList.add("on");
    };
    box.appendChild(btn);
  });
}

async function loadCodes() {
  try {
    const data = await api("/defect-codes");
    state.codes = data.groups || [];
    state.codeIndex = {};
    state.codes.forEach(g => g.items.forEach(it => {
      state.codeIndex[it.code] = { name: it.name, category: g.category };
    }));
  } catch (e) {
    banner("缺陷码字典加载失败：" + e.message, "err");
  }
}

async function loadRecent() {
  const box = document.getElementById("recent-list");
  try {
    const data = await api("/defects");
    if (!data.defects.length) {
      box.innerHTML = '<div class="hint">本线还没有录入记录</div>';
      return;
    }
    box.innerHTML = data.defects.slice(0, 8).map(d => `
      <div class="list-item">
        <div>
          <div>${escapeHtml(d.description)}</div>
          <div class="meta">${escapeHtml(d.defect_no)} · ${escapeHtml(d.work_order_id)}
            · ${escapeHtml(d.severity || "")} · ${escapeHtml(d.recorded_at || "")}</div>
        </div>
        <div style="text-align:right; white-space:nowrap">
          <span class="tag ${d.status}">${d.status === "pending" ? "已提交" : "待确认"}</span>
          ${d.is_backfill ? '<span class="tag backfill">补录</span>' : ""}
        </div>
      </div>`).join("");
  } catch (e) {
    box.innerHTML = '<div class="hint">记录加载失败：' + escapeHtml(e.message) + "</div>";
  }
}

/* =====================================================================
   第 1 步：数量 / 照片压缩 / 表单校验 / 提交
   ===================================================================== */
function bumpQty(delta) {
  const el = document.getElementById("qty");
  const next = Math.max(1, Math.min(99999, (parseInt(el.value, 10) || 1) + delta));
  el.value = next;
}

function compressImage(file) {
  /* 浏览器侧压缩：最长边 1280、JPEG 0.7。
     手机上原图常 3~5MB，压缩后 150~300KB，弱网下这是能否传上去的关键。 */
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxSide = 1280;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = () => reject(new Error("图片读取失败"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("图片读取失败"));
    reader.readAsDataURL(file);
  });
}

async function onPhotoChange(evt) {
  const file = evt.target.files && evt.target.files[0];
  if (!file) return;
  try {
    const dataUrl = await compressImage(file);
    document.getElementById("photo-img").src = dataUrl;
    document.getElementById("photo-preview").classList.remove("hidden");
    state.photoData = dataUrl;
    state.photoToken = null;          // 换了图，旧 token 作废
    // 联网时立即预上传，提交时只带 token（包体小、失败可单独重试）
    if (navigator.onLine) {
      try {
        const data = await api("/uploads/photo", {
          method: "POST", body: JSON.stringify({ photo: dataUrl }),
        });
        state.photoToken = data.photo_token;
      } catch (e) {
        banner("照片暂存失败，提交时将随单一起上传：" + e.message, "warn");
      }
    }
  } catch (e) {
    banner(e.message, "err");
  } finally {
    evt.target.value = "";             // 允许重复选同一张
  }
}

function clearPhoto() {
  state.photoData = null;
  state.photoToken = null;
  document.getElementById("photo-preview").classList.add("hidden");
  document.getElementById("photo-img").src = "";
}

function validateForm() {
  const workOrder = document.getElementById("work-order").value.trim();
  const desc = document.getElementById("description").value.trim();
  const qty = parseInt(document.getElementById("qty").value, 10) || 0;
  const err = document.getElementById("desc-err");
  const woErr = document.getElementById("wo-err");
  err.classList.remove("show"); woErr.classList.remove("show");

  if (!workOrder) {
    woErr.textContent = "请填写工单号";
    woErr.classList.add("show");
    return null;
  }
  if (desc.length < 4) {
    err.textContent = "描述至少 4 个字，便于准确归类";
    err.classList.add("show");
    return null;
  }
  if (qty < 1) {
    err.textContent = "数量至少为 1";
    err.classList.add("show");
    return null;
  }
  const severity = document.querySelector("#sev-chips .chip.on").dataset.sev;
  return { workOrder, desc, qty, severity };
}

function newClientDraftId() {
  /* 离线补传幂等键：优先用 crypto.randomUUID，老浏览器回退时间戳+随机 */
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "dr-" + Date.now() + "-" + Math.random().toString(16).slice(2, 10);
}

async function submitDefect() {
  if (state.submitting) return;
  const form = validateForm();
  if (!form) return;

  const payload = {
    work_order_id: form.workOrder,
    op_code: state.opCode,
    description: form.desc,
    qty: form.qty,
    severity: form.severity,
    // 发生时刻用本机时间；离线暂存时它就是暂存时刻，补录标记由此而来
    occurred_at: new Date().toISOString(),
    client_draft_id: newClientDraftId(),
  };

  /* ---- 离线：直接入队，不发网络请求 ---- */
  if (!navigator.onLine) {
    openOfflinePicker(payload);
    return;
  }

  const btn = document.getElementById("btn-submit");
  btn.disabled = true; btn.textContent = "提交中…";
  state.submitting = true;
  try {
    if (state.photoData && !state.photoToken) {
      const up = await api("/uploads/photo", {
        method: "POST", body: JSON.stringify({ photo: state.photoData }),
      });
      state.photoToken = up.photo_token;
    }
    if (state.photoToken) payload.photo_token = state.photoToken;

    const data = await api("/defects", {
      method: "POST", body: JSON.stringify(payload),
    });
    state.draftNo = data.defect_no;
    state.suggested = data.suggested || [];
    renderSuggestions(data);
    setStep(2);
    if (data.normalize && data.normalize.degraded) {
      banner(data.normalize.degraded_reason, "warn", true);
    }
  } catch (e) {
    // 网络类错误（非业务错误）→ 自动入队，避免现场白填
    if (e.code === -1 || e.code === undefined) {
      openOfflinePicker(payload);
      banner("网络异常，已转为离线暂存", "warn");
    } else {
      banner(e.message, "err", true);
    }
  } finally {
    btn.disabled = false; btn.textContent = "提交并获取候选缺陷码";
    state.submitting = false;
  }
}

/* 离线提交：先人工选码（此时无法调用归一化），再入队 */
function openOfflinePicker(payload) {
  banner("当前离线：请手动选择缺陷码，恢复网络后自动补传", "warn", true);
  state.pendingOffline = payload;
  renderAllCodes(code => {
    enqueue({ payload, defect_code: code });
    document.getElementById("all-codes").classList.add("hidden");
    showReceipt(null, true);
    resetFormKeepQueue();
  }, "离线提交：请选择缺陷码");
}

/* =====================================================================
   第 2 步：候选缺陷码 → 人工确认
   ===================================================================== */
function renderSuggestions(data) {
  const area = document.getElementById("suggest-area");
  document.getElementById("draft-no").textContent = data.defect_no;
  const list = data.suggested || [];

  if (!list.length) {
    area.innerHTML = '<div class="hint">系统没有给出可靠候选，请从全部缺陷码中选择。</div>';
    renderAllCodes(confirmCode);
    return;
  }

  /* 按分组渲染大按钮：候选码 + 置信度，点击即进入确认 */
  const groups = {};
  list.forEach(item => {
    (groups[item.category] = groups[item.category] || []).push(item);
  });
  area.innerHTML = Object.keys(groups).map(cat => `
    <div style="margin-bottom:14px">
      <div class="hint" style="margin-bottom:8px">${escapeHtml(cat)}</div>
      <div class="chips">
        ${groups[cat].map(it => `
          <button type="button" class="chip wide" onclick="confirmCode('${it.code}')">
            <strong>${escapeHtml(it.name)}</strong>
            <span style="color:#6b7688; font-size:12px; margin-left:8px">
              ${it.code} · ${Math.round((it.confidence || 0) * 100)}%
            </span>
          </button>`).join("")}
      </div>
    </div>`).join("");
}

/* 全量字典：按分组列出（离线选码与「都不对」共用） */
function renderAllCodes(onPick, title) {
  const box = document.getElementById("all-codes");
  box.classList.remove("hidden");
  if (title) {
    box.innerHTML = '<div class="hint" style="margin-bottom:10px">' + escapeHtml(title) + "</div>";
  }
  state.codes.forEach(group => {
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "14px";
    wrap.innerHTML = '<div class="hint" style="margin-bottom:8px">'
      + escapeHtml(group.category) + "</div>";
    const chips = document.createElement("div");
    chips.className = "chips";
    group.items.forEach(item => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip";
      btn.textContent = item.name;
      btn.onclick = () => onPick(item.code);
      chips.appendChild(btn);
    });
    wrap.appendChild(chips);
    box.appendChild(wrap);
  });
}

function toggleAllCodes() {
  const box = document.getElementById("all-codes");
  if (box.classList.contains("hidden")) {
    renderAllCodes(confirmCode);
  } else {
    box.classList.add("hidden");
  }
}

async function confirmCode(code) {
  if (!state.draftNo) {
    banner("草稿单号丢失，请重新提交", "err");
    return;
  }
  try {
    const data = await api(`/defects/${state.draftNo}/confirm`, {
      method: "POST", body: JSON.stringify({ defect_code: code }),
    });
    showReceipt(data, !!data.is_backfill);
  } catch (e) {
    banner(e.message, "err", true);
  }
}

/* =====================================================================
   第 3 步：回执
   ===================================================================== */
function showReceipt(data, backfill) {
  setStep(3);
  document.getElementById("receipt-no").textContent =
    (data && data.defect_no) || state.draftNo || "已暂存";
  document.getElementById("receipt-status").textContent =
    (data && data.status_text) || "已存入离线队列，联网后自动补传";
  const badge = document.getElementById("receipt-backfill");
  if (backfill) {
    badge.classList.remove("hidden");
    badge.textContent = data ? "补录 · 非实时上报" : "离线暂存 · 补传时标记补录";
  } else {
    badge.classList.add("hidden");
  }
  loadRecent();
  updateQueueBadge();
}

function resetForm() {
  state.draftNo = null;
  state.suggested = [];
  state.selectedCode = null;
  state.photoToken = null;
  state.photoData = null;
  document.getElementById("work-order").value = "";
  document.getElementById("description").value = "";
  document.getElementById("qty").value = 1;
  document.getElementById("desc-count").textContent = "0";
  document.querySelectorAll("#sev-chips .chip").forEach((c, i) => {
    c.classList.toggle("on", i === 1);      // 默认「一般」
  });
  document.querySelectorAll("#op-chips .chip").forEach(c => c.classList.remove("on"));
  state.opCode = "";
  clearPhoto();
  document.getElementById("suggest-area").innerHTML = "";
  document.getElementById("all-codes").innerHTML = "";
  document.getElementById("all-codes").classList.add("hidden");
  setStep(1);
}

function resetFormKeepQueue() {
  /* 离线入队后回到第 1 步继续录下一条，但保留草稿号展示 */
  setTimeout(() => {
    resetForm();
    banner("已存入离线队列，联网后自动补传", "info");
  }, 2500);
}

/* =====================================================================
   事件绑定与启动
   ===================================================================== */
let bound = false;
function bindEvents() {
  if (bound) return;
  bound = true;

  document.getElementById("description").addEventListener("input", e => {
    document.getElementById("desc-count").textContent = e.target.value.length;
  });
  document.getElementById("photo-input").addEventListener("change", onPhotoChange);

  document.querySelectorAll("#sev-chips .chip").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#sev-chips .chip").forEach(c => c.classList.remove("on"));
      btn.classList.add("on");
    });
  });

  /* 工单失焦即校验：把 40406 提前到填写阶段，别等提交才报错 */
  document.getElementById("work-order").addEventListener("blur", async e => {
    const val = e.target.value.trim();
    const hint = document.getElementById("wo-hint");
    const err = document.getElementById("wo-err");
    err.classList.remove("show");
    if (!val) {
      hint.textContent = "联网时失焦自动校验工单是否存在";
      return;
    }
    if (!navigator.onLine) {
      hint.textContent = "离线状态，工单将在补传时校验";
      return;
    }
    hint.textContent = "校验中…";
    try {
      const data = await api("/work-orders/" + encodeURIComponent(val));
      hint.textContent = "✓ " + data.product_name + " · " + data.line_id
        + " · 计划 " + data.planned_qty + " 件";
    } catch (ex) {
      hint.textContent = "工单校验未通过";
      err.textContent = ex.message;
      err.classList.add("show");
    }
  });

  window.addEventListener("online", () => {
    banner("网络已恢复，正在补传离线记录…", "info");
    syncQueue();
  });
  window.addEventListener("offline", () => {
    banner("网络已断开，提交将暂存到本地", "warn", true);
  });
}

/* =====================================================================
   离线暂存队列（localStorage）
   ---------------------------------------------------------------------
   协议：
   - 入队：离线提交或网络异常时写入，key = qt_defect_queue；
   - 幂等：每条带 client_draft_id，服务端唯一键，重复补传返回原单；
   - 补传：上线事件 / 启动 / 每 30 秒轮询，逐条先建单再确认缺陷码；
   - 上限：20 条，超限提示先联网（照片 base64 很占空间）；
   - 失败：retries+1，超过 5 次标红，可手动删除。
   ===================================================================== */
function readQueue() {
  try {
    return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
  } catch (e) {
    return [];
  }
}

function writeQueue(items) {
  localStorage.setItem(QUEUE_KEY, JSON.stringify(items));
  updateQueueBadge();
}

function enqueue(item) {
  const queue = readQueue();
  if (queue.length >= QUEUE_MAX) {
    banner("离线队列已满（20 条），请先连接网络补传", "err", true);
    return false;
  }
  queue.push(Object.assign({ created_at: new Date().toISOString(), retries: 0 }, item));
  writeQueue(queue);
  return true;
}

function updateQueueBadge() {
  const n = readQueue().length;
  const badge = document.getElementById("queue-badge");
  if (!badge) return;
  badge.textContent = n + " 条待补传";
  badge.classList.toggle("hot", n > 0);
}

let queueTimer = null;
function startQueueTimer() {
  if (queueTimer) return;
  queueTimer = setInterval(() => {
    if (navigator.onLine && readQueue().length) syncQueue();
  }, 30000);
}

async function syncQueue() {
  const queue = readQueue();
  if (!queue.length) return;
  const remain = [];
  let synced = 0;

  for (const item of queue) {
    try {
      // 1) 建单（幂等：同一 client_draft_id 不会落两条）
      const draft = await api("/defects", {
        method: "POST",
        body: JSON.stringify(Object.assign({ is_backfill: true }, item.payload)),
      });
      // 2) 人工确认过的缺陷码随队列一起补交
      if (item.defect_code) {
        await api(`/defects/${draft.defect_no}/confirm`, {
          method: "POST",
          body: JSON.stringify({ defect_code: item.defect_code }),
        });
      }
      synced += 1;
    } catch (e) {
      item.retries = (item.retries || 0) + 1;
      item.last_error = e.message || "补传失败";
      // 业务错误（4xx，如工单不存在）重试也不会成功，但保留给人工处理
      remain.push(item);
    }
  }

  writeQueue(remain);
  if (synced) {
    banner(`已补传 ${synced} 条离线记录`, "info");
    loadRecent();
  }
  if (remain.length) {
    banner(`还有 ${remain.length} 条补传失败，可在队列中查看原因`, "warn");
  }
}

/* 队列弹层：显示每条的重试次数与失败原因，支持单条删除 */
function showQueue() {
  const queue = readQueue();
  const old = document.getElementById("queue-modal");
  if (old) old.remove();

  const modal = document.createElement("div");
  modal.id = "queue-modal";
  modal.className = "login-mask";
  modal.innerHTML = `
    <div class="login-box">
      <h2>离线暂存（${queue.length} 条）</h2>
      <p>联网后会自动补传；补传时为单据打「补录」标记。</p>
      <div id="queue-list" style="max-height:50vh; overflow:auto; margin-bottom:14px"></div>
      <button class="btn" onclick="syncQueue().then(()=>showQueue())">立即补传</button>
      <button class="btn ghost" style="margin-top:8px"
              onclick="document.getElementById('queue-modal').remove()">关闭</button>
    </div>`;
  document.body.appendChild(modal);

  const list = modal.querySelector("#queue-list");
  if (!queue.length) {
    list.innerHTML = '<div class="hint">队列为空，所有记录都已上传</div>';
    return;
  }
  queue.forEach((item, idx) => {
    const row = document.createElement("div");
    row.className = "list-item";
    row.innerHTML = `
      <div>
        <div>${escapeHtml(item.payload.description.slice(0, 24))}</div>
        <div class="meta">${escapeHtml(item.payload.work_order_id)}
          · 重试 ${item.retries || 0} 次
          ${item.last_error ? "· " + escapeHtml(item.last_error) : ""}</div>
      </div>
      <button class="tag" style="border:none; cursor:pointer">删除</button>`;
    row.querySelector("button").onclick = () => {
      const q = readQueue();
      q.splice(idx, 1);
      writeQueue(q);
      showQueue();
    };
    if ((item.retries || 0) > 5) row.style.color = "#c0392b";
    list.appendChild(row);
  });
}

/* 启动：有令牌先校验有效性，再加载数据 */
(async function init() {
  if (!state.token) {
    document.getElementById("login-mask").classList.remove("hidden");
    return;
  }
  try {
    const data = await api("/auth/me");
    if (data.user.role !== "shift_leader") {
      logout();
      document.getElementById("login-err").textContent = "该账号不是班组长";
      document.getElementById("login-err").classList.add("show");
      return;
    }
    state.user = data.user;
    document.getElementById("login-mask").classList.add("hidden");
    await boot();
  } catch (e) {
    logout();
  }
})();
</script>
